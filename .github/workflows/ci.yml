name: dbt build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install -r requirements.txt
      - name: dbt deps
        run: dbt deps --profiles-dir .
      - name: dbt build
        run: dbt build --profiles-dir .
